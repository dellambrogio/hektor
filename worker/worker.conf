# The worker: monitor doing Hektor's speech to text, for hektor. Read by the worker scripts;
# which machine Hektor is comes from deploy.conf.
WORKER_MODEL=ggml-small.en.bin   # in ~/.local/share/hektor/models; setup.sh downloads it
WORKER_PORT=8910                 # whisper-server here on 127.0.0.1, and the tunnel's end on hektor
WORKER_THREADS=12                # 6 performance cores, 2 threads each; more or fewer was slower
