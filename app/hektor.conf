# Hektor settings. Bash syntax (KEY=value, quote values with spaces or '#'), read when the app starts.
# Override any of them per machine in ~/.config/hektor/hektor.conf, which is read after this file.
# Models live in ~/.local/share/hektor, fetched by fetch-models.sh.

# --- Voice -------------------------------------------------------------------------------------
# piper voice, a .onnx in ~/.local/share/hektor/voices; get more with: ./fetch-models.sh NAME
#   en_US-john-medium, en_US-ryan-high, en_US-norman-medium, en_US-joe-medium, en_US-lessac-medium
#   (list at https://huggingface.co/rhasspy/piper-voices)
VOICE=en_US-john-medium
SPEED=1.0               # phoneme length: >1 slower, <1 faster
VOLUME=1.0              # 0-1 of full level; the speech is evened out and brought up to this
SENTENCE_PAUSE=0.2      # seconds of silence between sentences
EXPRESSIVENESS=         # piper noise scale, empty = voice default (~0.667); lower = flatter
RHYTHM_VARIATION=       # piper noise-w scale, empty = voice default (~0.8); lower = more even timing

# Non-English replies are spoken by espeak-ng instead
ESPEAK_SPEED=175        # words per minute
ESPEAK_PITCH=50         # 0-99

# --- Voice effect ------------------------------------------------------------------------------
# small   small, higher, slightly crunchy robot (tuned below)
# kitt    pitched down, metallic echo, band-limited like a dashboard speaker
# robot   flat monotone robot
# plain   no effect
# custom  FX_CUSTOM, any ffmpeg audio filter chain
EFFECT=small

SMALL_PITCH=1.3         # >1 higher, <1 deeper (speed is kept)
SMALL_BITS=10           # bit crusher, lower = crunchier, 16 = off
SMALL_ECHO_MS=8         # very short echo: a small metal body
SMALL_HIGHPASS=250      # Hz, a small speaker has no bass

FX_CUSTOM='aecho=0.8:0.9:40|80:0.4|0.2,flanger'

# --- Speech recognition ------------------------------------------------------------------------
WHISPER_MODEL=~/.local/share/hektor/models/ggml-base.bin  # ggml-small.bin is more accurate, slower
WHISPER_LANGUAGE=en     # Hektor speaks English; auto detects the language (slower)
WHISPER_THREADS=8
WHISPER_SHORT_CONTEXT=yes  # encode just the recording, not whisper's whole 30 s window: ~3x faster for a short question
WHISPER_WORKER=         # another computer doing it faster (worker/ in the repo), e.g. http://127.0.0.1:8910/inference
                        # through its tunnel; empty = none. When it isn't there, whisper runs here.

# --- Wake word ---------------------------------------------------------------------------------
WAKE=yes                # listen for the wake phrases; no = only the talk key starts a conversation
WAKE_PHRASES="hey hector,hi hector"  # comma separated, words the vosk model knows ("hektor" isn't one)
WAKE_MODEL=~/.local/share/hektor/models/vosk-model-small-en-us-0.15
# Cutting in while Hektor talks: it stops and listens to the new question (not while it thinks: plain
# speech then passed for the wake word and cancelled questions; the talk key still cancels).
INTERRUPT="wake"        # wake: the wake word; talk: just start talking (needs audio-setup.sh, so Hektor
                        # doesn't hear itself); "wake talk" for both; "" = wait until it's done
INTERRUPT_RMS=600       # talk: mic level that counts as you talking over Hektor (its own voice leaks
                        # through the echo canceller up to ~300 here; --debug logs the loudest per reply)
INTERRUPT_RUN=4         # talk: 100 ms loud chunks in a row

# --- Screen ------------------------------------------------------------------------------------
VOICE_STRIPE=yes        # a KITT-like stripe under the eyes: listening (your voice), thinking, speaking
STRIPE_LISTENING=#ff3c32   # red, like KITT: it's recording you
STRIPE_PARSING=#f0be3c     # amber sweep: whisper works out what you said
STRIPE_GENERATING=#aa78ff  # violet sweep: Claude answers, the voice is made
STRIPE_SPEAKING=#20e6c8    # teal, like the eyes

# --- Sounds ------------------------------------------------------------------------------------
# Little robot noises, made up on the spot: a chirp when it wakes up, a blip when it got you, one per
# mood, and now and then an idle one to show it's alive. Try them: ../dev/run.sh sound all
SOUND_VOLUME=1.0        # 0-1
IDLE_SOUNDS="25 90"     # seconds between idle noises, random in this range; "0 0" = none
SLEEP_SOUNDS=yes        # soft snoring while asleep, in time with the eyes breathing; no = silent sleep

# --- Recording ---------------------------------------------------------------------------------
SILENCE_END=1.5         # seconds of quiet after speech that end the recording
SILENCE_SHARE=0.2       # quiet = under this share of your speech's typical loudness (or the threshold);
                        # raise it if recordings go on after you stop, lower it if they cut you off
NO_SPEECH=8             # give up if nothing is said for this long
FOLLOW_UP=6             # after an answer Hektor listens again for this long: just go on talking, no wake
                        # word; quiet that long ends the conversation. 0 = say "hey hector" every time
MAX_LEN=30              # longest recording, seconds
MIN_RMS=15              # lowest speech threshold, for very quiet rooms
NOISE_FACTOR=2.5        # threshold = background noise x this; raise if noise triggers it, lower if it misses you
MIC_HIGHPASS=300        # Hz, cuts hum and fan noise below it (speech is mostly above); 0 = off
MIC_NOISE_SUPPRESSION=yes  # record through the "Hektor mic" (WebRTC noise suppression and echo
                        # cancellation) when audio-setup.sh has added it; no = the plain mic
# Check all of these live with: ../dev/run.sh mic-test
SPEECH_RUN=3            # talking = this many of the last SPEECH_RUN + 2 chunks loud and voiced
VOICED=0.6              # how voiced (0-1) a chunk must be to sound like talking: vowels ~0.6-1, fans,
                        # hiss, clicks and thumps ~0.2-0.45; also gates the wake word
PREFERRED_MICS="alsa_input.usb-046d_MX_Brio"  # PipeWire node name prefixes, space separated, first wins

# --- Camera ------------------------------------------------------------------------------------
# The eyes follow your face; nobody around for SLEEP_AFTER seconds and Hektor falls asleep, and wakes
# when a face shows up (or on the wake word, or a key). Check it with the preview: key v.
CAMERA=yes              # no: don't use the camera (like --no-camera); the eyes just look around
PREFERRED_CAMERAS="MX Brio"  # parts of camera names, space separated, first wins; else the first color camera
CAMERA_FPS=8            # face checks per second
CAMERA_MIRROR=no        # yes if the eyes look away from you instead of at you
FACE_GAZE=1.3           # how far the eyes turn for a face at the edge of the picture (1 = to the edge)
FACE_MIN_SCORE=0.7      # face detector confidence, 0-1: raise if it sees faces that aren't there
FACE_MODEL=~/.local/share/hektor/models/face_detection_yunet_2023mar.onnx
FACE_RECOGNITION=yes    # who the face is, for people who asked Hektor to "remember me, I'm ..." (faces.py)
FACE_RECOGNIZER=~/.local/share/hektor/models/face_recognition_sface_2021dec.onnx
LOOK_TO_TALK=yes        # someone Hektor knows by face looking at it for LOOK_TIME s makes it listen, no wake
                        # word (once; again after they've looked away). Strangers still say "hey hector"
LOOK_TIME=1.5
LOOK_YAW=0.25           # how straight a face must look at the camera (0 = dead on): raise if it doesn't
                        # notice you looking, lower if it listens when you only glance
FACE_MATCH=0.4          # how alike (cosine, 0-1) a face must be to someone's: raise if it mixes people up,
                        # lower if it doesn't know people it should (SFace suggests 0.363)
SLEEP_AFTER=300         # seconds with nobody around before falling asleep; 0 = never
GREET_AFTER=60          # a face showing up after this long away gets a happy hello

# --- Claude ------------------------------------------------------------------------------------
PROMPT="You are Hektor, a small desk robot with two big expressive eyes. \
The user is talking to you by voice and your answer will be read aloud by a speech synthesizer. \
Reply in one to three short spoken sentences of plain text: no markdown, lists, code, emoji or URLs. \
Reply in the same language the user spoke. \
Start every reply with your mood in square brackets, one of [neutral] [happy] [sad] [surprised] [confused] [angry]; \
it shows on your eyes and is not read aloud. \
You can read (not change) the user's Gmail, Google Calendar, Google Drive and Claude Docs through MCP tools; \
load them with ToolSearch when a question needs them. \
A question may start with a note like [Anna is in front of you]: the camera recognized who's talking. \
Use their name now and then, naturally; never mention the note or the camera unless asked. \
Before you search the web or look at mail, calendar or files, say one very short sentence like \
'Let me look that up.' Never list sources or links, and don't describe your searches: just answer."
MODEL=claude-haiku-5-5  # the fastest to start answering; or claude-sonnet-5-5, claude-opus-5-5 (empty = Claude Code's
                        # default). The monitor app switches it while Hektor runs
FORGET_AFTER=300        # seconds without talking after which a new conversation starts
