# Hektor: a noise-suppressed, echo-cancelled mic for the app (WebRTC, as in video calls).
#   "Hektor mic"      (hektor_mic)      source the app records from
#   "Hektor speaker"  (hektor_speaker)  sink the app plays to, so its own voice is cancelled from the mic
# The app moves the capture side to the mic it picks (hektor_ec_capture); playback follows the default
# output. Nothing else uses these unless you pick them. Installed by audio-setup.sh.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            audio.channels = 1
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.transient_suppression = true   # keyboard clicks
                webrtc.voice_detection = false
                webrtc.gain_control = false           # keep levels steady for the speech threshold
            }
            capture.props = {
                node.name = "hektor_ec_capture"
                node.passive = true
            }
            source.props = {
                node.name = "hektor_mic"
                node.description = "Hektor mic"
                priority.session = 0                  # never the default source
                priority.driver = 0
            }
            sink.props = {
                node.name = "hektor_speaker"
                node.description = "Hektor speaker"
                priority.session = 0                  # never the default output
                priority.driver = 0
            }
            playback.props = {
                node.name = "hektor_ec_playback"
                node.passive = true
            }
        }
    }
]
